{% extends 'base.html' %}
{% load static nav_extras %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/smart_companion.css' %}">
{% endblock %}

{% block content %}
  <div class="companion-page">
    <section class="companion-card">
      <div class="companion-card-head">
        <div>
          <h2>AIRA</h2>
          <p>Smart Companion</p>
        </div>
      </div>

      <div class="companion-body" data-aira-image="{% static 'images/aira-wave-1.png' %}">
        <article class="companion-message">
          <div class="companion-bot-icon companion-aira-avatar">
            <img src="{% static 'images/aira-wave-1.png' %}" alt="AIRA">
          </div>
          <div class="message-stack">
            <div class="assistant-bubble">
              Hello! I'm AIRA. Ask me about requirements, evidence, deadlines, or review status.
            </div>
          </div>
        </article>
      </div>

      <footer class="companion-composer">
        <div class="composer-row">
          <input type="text" placeholder="Ask about requirements, missing documents, or deadlines...">
          <button type="button" aria-label="Send message">{% icon 'chevron-right' %}</button>
        </div>
        <p>AI responses are advisory only. Verify with your QA Office.</p>
      </footer>
    </section>
  </div>
{% endblock %}
