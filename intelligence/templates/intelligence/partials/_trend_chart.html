<svg viewBox="0 0 520 260" role="img">
  <g class="line-grid">
    <line x1="30" y1="40" x2="500" y2="40"></line>
    <line x1="30" y1="100" x2="500" y2="100"></line>
    <line x1="30" y1="160" x2="500" y2="160"></line>
    <line x1="30" y1="220" x2="500" y2="220"></line>
    <line x1="30" y1="40" x2="30" y2="220"></line>
    <line x1="125" y1="40" x2="125" y2="220"></line>
    <line x1="220" y1="40" x2="220" y2="220"></line>
    <line x1="315" y1="40" x2="315" y2="220"></line>
    <line x1="410" y1="40" x2="410" y2="220"></line>
  </g>
  <g class="line-labels">
    <text x="18" y="44">36</text>
    <text x="18" y="104">27</text>
    <text x="18" y="164">18</text>
    <text x="24" y="224">0</text>
    <text x="30" y="242">W1 Jun</text>
    <text x="120" y="242">W2 Jun</text>
    <text x="210" y="242">W3 Jun</text>
    <text x="300" y="242">W4 Jun</text>
    <text x="390" y="242">W1 Jul</text>
    <text x="475" y="242">W2 Jul</text>
  </g>
  <polyline
    class="approval-line"
    points="{{ trend_approval_points }}"
    data-tooltip="Approvals · weekly submission totals"
  ></polyline>
  <polyline
    class="revision-line"
    points="{{ trend_revision_points }}"
    data-tooltip="Revisions · weekly revision totals"
  ></polyline>
  <g class="approval-points">
    {% for point in trend_approval_data %}
      <circle
        cx="{{ point.x }}"
        cy="{{ point.y }}"
        r="2"
        tabindex="0"
        data-tooltip="Approvals · week of {{ point.label }}: {{ point.value }} submissions"
      ></circle>
    {% endfor %}
  </g>
  <g class="revision-points">
    {% for point in trend_revision_data %}
      <circle
        cx="{{ point.x }}"
        cy="{{ point.y }}"
        r="2"
        tabindex="0"
        data-tooltip="Revisions · week of {{ point.label }}: {{ point.value }} revisions"
      ></circle>
    {% endfor %}
  </g>
</svg>
<div class="chart-legend">
  <span class="approval" data-tooltip="Approvals · weekly submission totals">Approvals</span>
  <span class="revision" data-tooltip="Revisions · weekly revision totals">Revisions</span>
</div>
