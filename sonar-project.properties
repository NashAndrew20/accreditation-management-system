# Project identity is supplied by the GitHub Actions workflow so the same
# configuration can be used with the SonarQube Cloud project created by the team.
sonar.projectName=JMCFI AMS
sonar.sources=accounts,accreditation,config,core,dashboard,intelligence,resources,static,templates
sonar.tests=accounts,accreditation,core,dashboard,intelligence,resources
sonar.test.inclusions=**/tests.py,**/test_*.py
sonar.exclusions=**/tests.py,**/test_*.py,**/migrations/**,**/__pycache__/**,**/*.pyc,.venv/**,db.sqlite3,media/**,staticfiles/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
