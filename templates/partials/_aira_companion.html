{% load static %}

{% if user.is_authenticated and aira_guidance %}
  <aside class="aira-companion-strip" data-aira-companion aria-label="AIRA Smart Companion">
    <div class="aira-companion-bubble">
      <button
        type="button"
        class="aira-companion-dismiss"
        data-aira-dismiss
        aria-label="Minimize AIRA"
        title="Minimize AIRA"
      >×</button>

      <div class="aira-companion-copy">
        <div class="aira-companion-heading">
          <strong>AIRA</strong>
        </div>
        <p class="aira-companion-message">{{ aira_guidance.message }}</p>
      </div>
    </div>

    <div class="aira-companion-avatar" aria-hidden="true">
      <img src="{% static 'images/aira-wave-1.png' %}" alt="">
    </div>

    <button
      type="button"
      class="aira-companion-restore"
      data-aira-restore
      aria-label="Show AIRA Smart Companion"
      title="Show AIRA Smart Companion"
      hidden
    >
      <img src="{% static 'images/aira-wave-1.png' %}" alt="">
    </button>
  </aside>
{% endif %}
