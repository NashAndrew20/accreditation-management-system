{% load static nav_extras %}

{% if user.is_authenticated and aira_guidance %}
  <aside class="aira-companion-strip" data-aira-companion aria-label="AIRA Smart Companion">
    <div class="aira-companion-bubble">
      <div class="aira-companion-copy">
        <div class="aira-companion-heading">
          <strong>AIRA</strong>
        </div>
        <p class="aira-companion-message">{{ aira_guidance.message }}</p>
      </div>
    </div>

    <div class="aira-companion-avatar">
      <img class="aira-talk-frame aira-talk-frame--idle" src="{% static 'images/aira-wave-1.png' %}" alt="">
      <img class="aira-talk-frame aira-talk-frame--open" src="{% static 'images/aira-talking-1.png' %}" alt="">
      <img class="aira-talk-frame aira-talk-frame--smile" src="{% static 'images/aira-talking-2.png' %}" alt="">
      <button
        type="button"
        class="aira-companion-dismiss"
        data-aira-dismiss
        aria-label="Minimize AIRA"
        title="Minimize AIRA"
      >−</button>
    </div>

    <button
      type="button"
      class="aira-companion-restore"
      data-aira-restore
      aria-label="Show AIRA Smart Companion"
      title="Show AIRA Smart Companion"
      hidden
    >
      {% icon 'message' 'aira-companion-restore-icon' %}
    </button>
  </aside>
{% endif %}
